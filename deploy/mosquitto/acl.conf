# Mosquitto ACL -- installed to /etc/mosquitto/acl by scripts/bootstrap-pi.sh.
# Least privilege: publishers write only, the API subscriber reads only.

# Enviro Weather node (outdoor) -- write-only to its own topic.
user enviro-observatory-weather
topic write enviro/observatory-weather

# Indoor air node(s) (ESP32-S2 / ESPHome) -- write-only. The firmware exposes no
# MQTT-controllable component (its one switch is `internal: true`) and has
# discovery off, so it subscribes to nothing.
user indoor-node
topic write indoor/#

# FastAPI subscriber (obs-api) -- read-only, both feeds.
user obs-api-subscriber
topic read enviro/#
topic read indoor/#
