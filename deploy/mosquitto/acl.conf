# Mosquitto ACL -- installed to /etc/mosquitto/acl by scripts/bootstrap-pi.sh.
# Least privilege: publishers write only, the API subscriber reads only.

# Enviro Weather node (outdoor) -- write-only to its own topic.
user enviro-observatory-weather
topic write enviro/observatory-weather

# Indoor air node(s) (ESP32-S2 / ESPHome) -- write-only. The firmware exposes no
# MQTT-controllable component (its one switch is `internal: true`) and has
# discovery off, so it subscribes to nothing.
user indoor-node
topic write indoor/#

# FastAPI subscriber (obs-api) -- read-only, both feeds.
user obs-api-subscriber
topic read enviro/#
topic read indoor/#

# Health monitor for the xmas-lights project on the same Pi (2026-11-14) --
# read-only: broker statistics plus one fixed-interval topic (indoor CO2, every
# 60 s) and one irregular topic (Enviro batches, ~every 25 min). It proves the
# observatory loses no messages around xmas-lights hardware changes. Its client
# ids start with xmas-health-. It never publishes.
user xmas-health
topic read $SYS/broker/#
topic read indoor/living-room/sensor/co2/state
topic read enviro/observatory-weather
