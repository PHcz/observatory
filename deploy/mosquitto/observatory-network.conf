# Observatory: survive the boot-time network race.
#
# The broker binds a specific LAN address (listener 1883 <LAN IP>). That IP
# arrives via DHCP (router reservation) AFTER early boot, so mosquitto started
# first and died with "Error: Cannot assign requested address". systemd retried
# 5x within one second, hit the default start-rate limit, and gave up
# permanently — silencing every MQTT sensor (outdoor Enviro + indoor node) for
# 14h on 2026-07-18 until it was noticed by hand.
#
# Wait for the network to actually be online, and never permanently give up.
[Unit]
After=network-online.target
Wants=network-online.target
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
