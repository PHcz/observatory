# Bound journald usage. Installed by bootstrap-pi.sh Section 15 to
# /etc/systemd/journald.conf.d/.
#
# The Pi keeps the journal in RAM (Storage=volatile in journald.conf, with
# /var/log on tmpfs) to spare the SD card. In that mode only the Runtime*
# limits apply; the System* ones below matter only if Storage is ever switched
# to persistent. Without RuntimeMaxUse journald capped itself at ~10% of /run,
# about 43 hours of logs (security audit F49). 120M is ~3-4 days here and
# costs at most that much RAM.

[Journal]
RuntimeMaxUse=120M
RuntimeKeepFree=100M
SystemMaxUse=500M
SystemKeepFree=200M
MaxFileSec=1week
Compress=yes
