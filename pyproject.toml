[project]
name = "observatory"
version = "0.1.0"
description = "Home observatory: Pi 4 + weather + muon + space weather + earthquakes + aurora + dashboard"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",  # GHSA: NestedSecretsSettingsSource symlink read (Dependabot, 2026-06)
  "yoyo-migrations>=9.0",
  "structlog>=26.1.0",
  "pyserial>=3.5",
  "sdnotify>=0.3.2",
  "httpx>=0.27",
  "defusedxml>=0.7",
  "fastapi>=0.142.2,<0.143",  # >=0.133 drops upper bound on starlette so we can pin >=1.0.1 below
  "starlette>=1.7.0",  # floor clears PYSEC-2026-161 + CVE-2025-62727 (08-11 audit) + form() DoS / hostname-poison (Dependabot, 2026-06)
  "uvicorn[standard]>=0.54.0,<0.55",
  "websockets>=17.1,<18",
  "astral>=3.0",
  "aiomqtt>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16.10",
  "mypy>=2.4.0",
  "bandit[toml]>=1.9.4",
  "pip-audit>=2.10.1",
  "pre-commit>=4.6.2",
  "types-PyYAML",
  "testcontainers[mqtt]>=4.15.0,<5",
]
analysis = [
  "polars>=1.44.2",
  "scipy>=1.13",
  "matplotlib>=3.11.2",
  "typer>=0.27.2",
]

[project.scripts]
picomuon = "picomuon.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16.10",
  "mypy>=2.4.0",
  "bandit[toml]>=1.9.4",
  "pip-audit>=2.10.1",
  "pre-commit>=4.6.2",
  "types-PyYAML",
  "testcontainers[mqtt]>=4.15.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["observatory", "picomuon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers -m 'not network and not integration and not slow'"
asyncio_mode = "auto"
markers = [
  "network: requires live network access (skipped by default; run with -m network -s)",
  "integration: requires Docker (Mosquitto container) and real SQLite; pre-release gate only",
  "slow: long-running tests (>5s); excluded from default fast loop",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# typer requires typer.Option(...) calls in argument defaults (B008 is the idiom).
"picomuon/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["observatory", "tests", "scripts", "picomuon"]
exclude = ["frontend", "migrations", ".venv", "tests/fixtures"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "yoyo.*",
    "serial.*",
    "sdnotify.*",
    "defusedxml.*",
    "websockets.*",
    "astral.*",
    "testcontainers.*",
    "polars.*",
    "scipy.*",
    "matplotlib.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "frontend", ".venv"]
# B101: assert_used — fine in tests, excluded above
# B311: pseudo-random — random.uniform used ONLY for backoff jitter in observatory.pollers._http;
#       not a security/crypto context (jitter spreads thundering-herd, doesn't authenticate anything)
# B404: subprocess import — needed by observatory.muon.__main__ for `chronyc tracking` (NTP gate)
# B603: subprocess call without shell — actually safer (no shell injection); we never pass user input
# B607: partial executable path — fine, PATH is controlled by systemd EnvironmentFile on the Pi
# (B405/B314 NOT skipped — addressed properly via defusedxml in observatory.pollers.bgs)
skips = ["B101", "B311", "B404", "B603", "B607"]

[tool.uv]
# Security floor for a transitive dep (msgpack has no direct importer here).
# Clears the high-severity OOB-read advisory (Dependabot, 2026-06); keeps it from
# regressing on a future `uv lock`.
constraint-dependencies = [
  "msgpack>=1.2.1",
  # pip is transitive via pip-api (pip-audit); floor clears GHSA-wf93-45jw-7689
  # (path traversal in entry-point names, pip < 26.1.2 — Dependabot #16, 2026-07)
  # and PYSEC-2026-3721 (pip < 26.2 — pip-audit, 2026-08).
  "pip>=26.2",
  # Pillow is transitive via matplotlib (analysis extra, picomuon CLI only — not
  # deployed to the Pi). 12.3.0 is a coordinated security release clearing 13
  # HIGH/MEDIUM advisories against < 12.3.0 (heap OOB writes, decompression-bomb
  # bypasses, OS command injection, DoS — Dependabot, 2026-07).
  "pillow>=12.3.0",
  # sqlparse is transitive via yoyo-migrations (statement splitting in migration
  # files). 0.6.0 clears 3 HIGH ReDoS/CPU-DoS advisories + 1 MEDIUM backslash
  # escape issue against <=0.5.6.dev0 (Dependabot, 2026-08). yoyo declares
  # `sqlparse` with no upper bound, so the 0.5->0.6 major bump resolves cleanly;
  # migration apply is verified against a real DB copy before deploy.
  "sqlparse>=0.6.0",
  # anyio is transitive via starlette (obs-api), httpx (external pollers) and
  # watchfiles. 4.14.2 clears GHSA-82r6-8w77-94w6 (CRITICAL — TLSStream IDNA
  # 2003 host-name encoding enables TLS certificate spoofing; hits httpx's
  # outbound HTTPS to the public APIs) and GHSA-5p39-cfhj-2xmp (MEDIUM —
  # process-pool workers block indefinitely on undrained stderr). Dependabot
  # #46/#47, 2026-09.
  "anyio>=4.14.2",
  # urllib3 is transitive via testcontainers/requests/docker — dev-scope only
  # (integration tests; never installed on the Pi). 2.8.0 clears PYSEC-2026-4175,
  # -4176 and -4177 against < 2.8.0 (pip-audit pre-push gate, 2026-10).
  "urllib3>=2.8.0",
  # virtualenv is transitive via pre-commit — dev tooling only, never on the Pi.
  # 21.7.12 clears PYSEC-2026-4014 (pip-audit pre-push gate, 2026-10).
  "virtualenv>=21.7.12",
]
