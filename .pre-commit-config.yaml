# Phase 1 pre-commit configuration.
# Fast hooks run on every `git commit`.
# Slow hooks (mypy strict, bandit, pip-audit, pytest --collect-only) run only on `git push`.
#
# Install:  pre-commit install && pre-commit install --hook-type pre-push
# Run:      pre-commit run --all-files
# Update:   pre-commit autoupdate

default_install_hook_types: [pre-commit, pre-push]

repos:
  # --- Fast hooks: every commit (must be < 2s total) ---

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: ^tests/fixtures/
      - id: check-yaml
        stages: [pre-commit]
        # ESPHome node configs use custom YAML tags (!secret, !include) that a
        # generic YAML parser can't resolve — exclude the firmware configs.
        exclude: ^firmware/
      - id: check-toml
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
        args: [--maxkb=500]

  - repo: local
    hooks:
      # Runs ruff from the PROJECT venv, so the hook and a local `ruff check` are
      # by construction the same binary at the same version. This used to be the
      # ruff-pre-commit repo with a pinned `rev:` that had to be hand-synced with
      # the floor in pyproject.toml; a skew made the two enforce different rules
      # (v0.9.10 passed while ruff 0.16.7 flagged RUF059), and Dependabot bumped
      # the pyproject floor without touching the rev, because it cannot see the
      # coupling. There is now no second version to drift.
      #
      # Measured faster than the isolated hook, not slower: ~0.03s vs ~0.32s, so
      # the <2s fast-hook budget is untouched.
      #
      # --force-exclude is required: pre-commit passes explicit filenames, and
      # without it ruff ignores extend-exclude (frontend, migrations, .venv).
      - id: ruff
        name: ruff (lint, --fix)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scanner)
        entry: gitleaks protect --staged --redact --config .gitleaks.toml
        language: system
        stages: [pre-commit]
        pass_filenames: false

  # --- Slow hooks: pre-push only (up to ~30s OK) ---

  - repo: local
    hooks:
      # Runs in the PROJECT venv, not an isolated pre-commit env, so it uses the
      # [tool.mypy] config in pyproject.toml verbatim: strict = true over
      # observatory, tests, scripts and picomuon.
      #
      # It used to be the mirrors-mypy hook with `args: [--strict, observatory/]`,
      # which checked the package ONLY while pyproject claimed four trees. Twenty
      # type errors accumulated under tests/ completely ungated, including a
      # math.isclose() on a `float | None` and an `int | str` compared to an int.
      # Narrowing the gate to a subset of what the config declares is how that
      # happens, so the gate now derives its scope from the config instead of
      # restating it.
      #
      # Running in the project venv also removes the additional_dependencies list
      # the isolated env needed (it lacked pytest/testcontainers, so it could not
      # have checked tests/ anyway) and the pinned `rev:`, which was a second
      # version-skew trap of the same shape as the ruff rev below.
      - id: mypy
        name: mypy (strict; scope from pyproject [tool.mypy])
        entry: uv run mypy
        language: system
        stages: [pre-push]
        pass_filenames: false

  - repo: local
    hooks:
      # From the project venv, so the hook and a local `bandit` are the same
      # version. The pinned rev had drifted: 1.8.3 here vs >=1.9.4 in pyproject.
      - id: bandit
        name: bandit (security lint)
        entry: uv run bandit -r observatory/ -c pyproject.toml
        language: system
        stages: [pre-push]
        pass_filenames: false

  - repo: local
    hooks:
      # From the project venv, which also fixes WHAT is audited. The old hook ran
      # in pre-commit's isolated env and therefore audited pip-audit's own
      # dependencies, not this project's -- that is why it needed
      # additional_dependencies pinning msgpack/pip/setuptools/urllib3 to stop the
      # TOOL's deps tripping the gate. Those pins are gone because the tool's deps
      # are no longer what gets audited: the project venv is. Its rev had drifted
      # too (v2.8.0 here vs >=2.10.1 in pyproject).
      - id: pip-audit
        name: pip-audit (project venv)
        entry: uv run pip-audit
        language: system
        stages: [pre-push]
        pass_filenames: false

  - repo: local
    hooks:
      # Required sensitive-data gate — runs on EVERY commit. Blocks personal
      # email in authorship, secret/credential files, GPS-tagged images, and any
      # content matching the local (gitignored) .git-sensitive-patterns list.
      - id: sensitive-data-gate
        name: sensitive-data gate (PII / GPS / secret files)
        entry: scripts/check-sensitive.sh
        language: script
        stages: [pre-commit]
        always_run: true
        pass_filenames: true
      - id: pytest-collect
        name: pytest --collect-only (import check)
        entry: uv run pytest --collect-only -q
        language: system
        stages: [pre-push]
        pass_filenames: false
